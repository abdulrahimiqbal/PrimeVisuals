<g font-family="Menlo, Consolas, monospace">
<text x="54" y="42" fill="#f8fafc" font-size="20" font-weight="700">Generic non-CM residual obstruction map</text>
<text x="54" y="68" fill="#94a3b8" font-size="13">Cycle 022 screens candidate representation jumps before data; experiment-eligible classes: 0</text>
<text x="74" y="98" fill="#38bdf8" font-size="12">candidate class</text>
<text x="440" y="98" fill="#38bdf8" font-size="12">decision</text>
<text x="560" y="98" fill="#38bdf8" font-size="12">blocking condition</text>
<rect x="54" y="88" width="1170" height="38" fill="#0b1424" stroke="#1e293b"/>
<text x="74" y="112" fill="#e2e8f0" font-size="13">complete_legendre_second_moment</text>
<text x="440" y="112" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="112" fill="#94a3b8" font-size="12">No nonzero residual remains after the exact complete-family theorem baseline.</text>
