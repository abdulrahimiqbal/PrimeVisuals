<text x="74" y="332" fill="#e2e8f0" font-size="13">higher_generic_legendre_moments</text>
<text x="440" y="332" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="332" fill="#94a3b8" font-size="12">No exact baseline or reproducible implementation exists.</text>
<rect x="54" y="352" width="1170" height="38" fill="#0b1424" stroke="#1e293b"/>
<text x="74" y="376" fill="#e2e8f0" font-size="13">l_adic_monodromy_trace_function</text>
<text x="440" y="376" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="376" fill="#94a3b8" font-size="12">The object is not concrete enough to score or reproduce.</text>
