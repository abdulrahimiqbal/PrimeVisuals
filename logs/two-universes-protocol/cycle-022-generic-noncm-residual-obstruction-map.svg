<text x="440" y="156" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="156" fill="#94a3b8" font-size="12">Deleting special loci still leaves no named nonzero generic residual.</text>
<rect x="54" y="176" width="1170" height="38" fill="#0b1424" stroke="#1e293b"/>
<text x="74" y="200" fill="#e2e8f0" font-size="13">fixed_generic_lambda_trace</text>
<text x="440" y="200" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="200" fill="#94a3b8" font-size="12">No preregistered finite-field theorem baseline and no full-scale integer trace engine.</text>
<rect x="54" y="220" width="1170" height="38" fill="#0f1b2d" stroke="#1e293b"/>
<text x="74" y="244" fill="#e2e8f0" font-size="13">incomplete_generic_lambda_window</text>
<text x="440" y="244" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="244" fill="#94a3b8" font-size="12">The required nonzero residual is not stated before computation.</text>
<rect x="54" y="264" width="1170" height="38" fill="#0b1424" stroke="#1e293b"/>
<text x="74" y="288" fill="#e2e8f0" font-size="13">generic_supersingular_lambda_roots</text>
<text x="440" y="288" fill="#f97316" font-size="13">blocked</text>
<text x="560" y="288" fill="#94a3b8" font-size="12">The residual after known supersingular, class-number, and extension-degree baselines is not </text>
